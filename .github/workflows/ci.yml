name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs:
    name: CI / docs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate documentation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          import sys
          from pathlib import Path
          from urllib.parse import urlparse

          required = (
              "README.md",
              "LICENSE",
              "SECURITY.md",
              "CONTRIBUTING.md",
              "TERMS.md",
              "PRIVACY.md",
              "CLA.md",
              "THIRD_PARTY_NOTICES.md",
          )
          missing = [path for path in required if not Path(path).is_file()]
          if missing:
              raise SystemExit(f"Missing required documentation: {', '.join(missing)}")

          markdown_files = sorted(Path(".").rglob("*.md"))
          trailing = []
          for path in markdown_files:
              for number, line in enumerate(path.read_text(encoding="utf-8").splitlines(), 1):
                  if line.endswith((" ", "\t")):
                      trailing.append(f"{path}:{number}")
          if trailing:
              raise SystemExit("Trailing whitespace found:\n" + "\n".join(trailing))

          link_pattern = re.compile(r"!?\[[^]]*\]\(([^)]+)\)")
          missing_links = []
          for path in markdown_files:
              for target in link_pattern.findall(path.read_text(encoding="utf-8")):
                  target = target.strip().split()[0].strip("<>")
                  parsed = urlparse(target)
                  if parsed.scheme or target.startswith("//") or target.startswith("#"):
                      continue
                  local = target.split("#", 1)[0].split("?", 1)[0]
                  if local and not (path.parent / local).resolve().is_file():
                      missing_links.append(f"{path}: {target}")
          if missing_links:
              raise SystemExit("Broken local documentation links:\n" + "\n".join(missing_links))

          mermaid_blocks = 0
          open_mermaid = False
          for path in markdown_files:
              for line in path.read_text(encoding="utf-8").splitlines():
                  if line.strip() == "```mermaid":
                      if open_mermaid:
                          raise SystemExit(f"Nested Mermaid fence in {path}")
                      open_mermaid = True
                      mermaid_blocks += 1
                  elif open_mermaid and line.strip() == "```":
                      open_mermaid = False
          if open_mermaid:
              raise SystemExit("Unclosed Mermaid fence")
          print(f"Validated {len(markdown_files)} Markdown files and {mermaid_blocks} Mermaid blocks")
          PY
